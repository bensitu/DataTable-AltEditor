<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

      integrity="sha384-6qOMjEs/dk1B8DWuMdvpXhSoFK8G0LAZAgA0WCuiPYo4zOpviuNw5/7W4qLc2EdE"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/2.3.8/css/dataTables.dataTables.css"
      integrity="sha384-Kpc+mQszh3/vUH/OusOZEQCoj2/fArR4w17g++67npFyTwNdldK7hGUdfHoHUX3b"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/buttons/3.2.6/css/buttons.dataTables.css"
      integrity="sha384-42AaX3WCFLKtNbbCrVe6FWc17rAvvtVmY5EH1aL1wO437kdBO/nAtfs04U0byl+W"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/select/3.1.3/css/select.dataTables.css"
      integrity="sha384-Kcn9jd7zuLVw0Z2CqnwrvI6ITtpMOAc+ah3b+te7G7vey5N+u5XHP7FWtCHE8Pce"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="../../dist/dataTables.altEditor.css" />
    <link rel="stylesheet" href="../examples.css" />
    <link rel="stylesheet" href="./example18.css" />
    <script src="../theme.js"></script>
  </head>

  <body class="examples-page">
    <main class="example-main">
      <header class="example-header">
        <nav aria-label="Example navigation">
          <a href="../../index.html">← All examples</a>
          · <a href="./example18.js">Configuration source</a> ·
          <a
            href="https://github.com/bensitu/DataTable-AltEditor/blob/master/docs/examples.md"
            >Example guide</a
          >
        </nav>
        <p class="example-eyebrow">DataTable-AltEditor / Example 18</p>
        <h1>Custom dialog layouts</h1>
        <p>
          Add and Edit use different templates. Select one or more rows to
          preview deletion details. Turn off the checkbox to use a plain
          confirmation. Changes reset on reload.
        </p>
      </header>
      <p>
        <label
          ><input id="show-details" type="checkbox" checked /> Show selected
          records in the delete dialog</label
        >
      </p>
      <div
        class="example-table"
        tabindex="0"
        role="region"
        aria-label="Editable table 1"
      >
        <table class="dataTable display" id="example"></table>
      </div>
      <p id="result" role="status" aria-live="polite">Ready.</p>
    </main>

    <template id="create-person">
      <section class="person-layout">
        <h2>Welcome a new colleague</h2>
        <p>Enter their contact information and choose a team.</p>
        <fieldset>
          <legend>Contact information</legend>
          <div data-alteditor-field="name"></div>
          <div data-alteditor-field="email"></div>
        </fieldset>
        <fieldset>
          <legend>Work</legend>
          <div data-alteditor-field="team"></div>
        </fieldset>
      </section>
    </template>
    <template id="edit-person">
      <section class="person-layout">
        <h2>Update colleague details</h2>
        <p data-person-summary></p>
        <div data-alteditor-field="team"></div>
        <div data-alteditor-field="name"></div>
        <div data-alteditor-field="email"></div>
      </section>
    </template>
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha384-wsqsSADZR1YRBEZ4/kKHNSmU+aX8ojbnKUMN4RyD3jDkxw5mHtoe2z/T/n4l56U/"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.datatables.net/2.3.8/js/dataTables.js"
      integrity="sha384-psSvVXCvq5rKxaGCE/6++WaL+UPL386fLbcVoODJQQOf/3XrJWK16KQTO/kkFXGm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.datatables.net/buttons/3.2.6/js/dataTables.buttons.js"
      integrity="sha384-3dnh4WjeAOO2NzGgB/WR1N2SaJwtGmC/pcIwyTNR+P8iNqjju6gNToClL60GClS1"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.datatables.net/select/3.1.3/js/dataTables.select.js"
      integrity="sha384-q/VS6T+Q4YoTiJWPVvhHcAUBZZjBXnjt+5VwF+mDgtQ5qHEM4ufO1oCpiVYQ0D+W"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.js"
      integrity="sha384-DXQlBty/lBVDkqL4VKQIlPyuBHCumaxsqVbwsQWRGh0NFBAkAAnOo7qlcR2x+hP9"
      crossorigin="anonymous"
    ></script>

    <script src="../../dist/dataTables.altEditor.js"></script>
    <script src="./example18.js"></script>
  </body>
</html>
