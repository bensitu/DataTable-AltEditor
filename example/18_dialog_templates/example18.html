<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Custom dialog layouts | AltEditor examples</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/2.3.8/css/dataTables.dataTables.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/buttons/3.2.6/css/buttons.dataTables.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/select/3.1.3/css/select.dataTables.css"
    />

    <link rel="stylesheet" href="../../dist/dataTables.altEditor.css" />
    <link rel="stylesheet" href="../examples.css" />
    <link rel="stylesheet" href="./example18.css" />
    <script src="../theme.js"></script>
  </head>

  <body class="examples-page">
    <main class="example-main">
      <header class="example-header">
        <nav aria-label="Example navigation">
          <a href="../../index.html">← All examples</a>
          · <a href="./example18.js">Configuration source</a> ·
          <a
            href="https://github.com/bensitu/DataTable-AltEditor/blob/develop/docs/examples.md"
            >Example guide</a
          >
        </nav>
        <p class="example-eyebrow">DataTable-AltEditor / Example 18</p>
        <h1>Custom dialog layouts</h1>
        <p>
          Add and Edit use different templates. Select one or more rows to
          preview deletion details. Turn off the checkbox to use a plain
          confirmation. Changes reset on reload.
        </p>
      </header>
      <p>
        <label
          ><input id="show-details" type="checkbox" checked /> Show selected
          records in the delete dialog</label
        >
      </p>
      <div
        class="example-table"
        tabindex="0"
        role="region"
        aria-label="Editable table 1"
      >
        <table class="dataTable display" id="example"></table>
      </div>
      <p id="result" role="status" aria-live="polite">Ready.</p>
    </main>

    <template id="create-person">
      <section class="person-layout">
        <h2>Welcome a new colleague</h2>
        <p>Enter their contact information and choose a team.</p>
        <fieldset>
          <legend>Contact information</legend>
          <div data-alteditor-field="name"></div>
          <div data-alteditor-field="email"></div>
        </fieldset>
        <fieldset>
          <legend>Work</legend>
          <div data-alteditor-field="team"></div>
        </fieldset>
      </section>
    </template>
    <template id="edit-person">
      <section class="person-layout">
        <h2>Update colleague details</h2>
        <p data-person-summary></p>
        <div data-alteditor-field="team"></div>
        <div data-alteditor-field="name"></div>
        <div data-alteditor-field="email"></div>
      </section>
    </template>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.datatables.net/2.3.8/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/buttons/3.2.6/js/dataTables.buttons.js"></script>
    <script src="https://cdn.datatables.net/select/3.1.3/js/dataTables.select.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.js"></script>

    <script src="../../dist/dataTables.altEditor.js"></script>
    <script src="./example18.js"></script>
  </body>
</html>
