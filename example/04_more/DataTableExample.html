<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Additional field options | AltEditor examples</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/2.3.8/css/dataTables.dataTables.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/buttons/3.2.6/css/buttons.dataTables.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/select/3.1.3/css/select.dataTables.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/responsive/3.0.8/css/responsive.dataTables.css"
    />
    <link rel="stylesheet" href="../../dist/dataTables.altEditor.css" />
    <link rel="stylesheet" href="../examples.css" />
    <script src="../theme.js"></script>
  </head>

  <body class="examples-page">
    <main class="example-main">
      <header class="example-header">
        <nav aria-label="Example navigation">
          <a href="../../index.html">← All examples</a>
        </nav>
        <p class="example-eyebrow">DataTable-AltEditor / Example 04</p>
        <h1>Additional field options</h1>
        <p>
          Explore table configuration and field options with a local JSON data
          source.
        </p>
      </header>
      <div
        class="example-table"
        tabindex="0"
        role="region"
        aria-label="Editable table 1"
      >
        <table class="dataTable display" id="testTableData">
          <thead>
            <tr>
              <th></th>
              <th></th>
              <th></th>
              <th></th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.datatables.net/2.3.8/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/buttons/3.2.6/js/dataTables.buttons.js"></script>
    <script src="https://cdn.datatables.net/select/3.1.3/js/dataTables.select.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.js"></script>
    <script src="https://cdn.datatables.net/responsive/3.0.8/js/dataTables.responsive.js"></script>
    <script src="../../dist/dataTables.altEditor.js"></script>
    <script>
      $(document).ready(function () {
        //////////////////////////////////////////
        /*
IMPORTANT - COLUMNDEFS

Always add the DT_RowId row and always add it as the first column!
- Visibility state doesnt matter but searchable
  state should be set to the same value.

Always add a type!
Current supported type parameters:
text      - for editable textfields (including numbers, emails etc.)
select    - for select menues, if used then options should be specified aswell
readonly  - for fields with readonly attribute.

Other parameters:

MANDATORY:
id        - Should be set to same value as data-parameter.
data      - Identifier of value in data from AJAX call.
title     - Title of column.

OPTIONAL:
pattern   - For inputvalidation of the textfield. Specify a regex for the pattern to use.
errorMsg  - Message that is shown when mismatch with pattern is found.
hoverMsg  - Message that is shown on mouseover on text fields (hints).
unique    - Data that can only exist once in the datatable. Shows an error on input if found.
special   - Only working setting is "portRange". This is in relation to input validation.
            If used then validation will check for a portrange in format (startPort:endPort)
            and validate both with the supplied regex.

*/
        //////////////////////////////////////////

        //Example of column definitions.
        var columnDefs = [
          {
            id: 'DT_RowId',
            data: 'DT_RowId',
            type: 'hidden',
          },
          {
            title: 'Select example',
            id: 'status',
            data: 'status',
            type: 'select',
            options: ['on', 'off'],
          },
          {
            title: 'Text example',
            id: 'ipAddress',
            data: 'ipAddress',
            type: 'text',
            pattern:
              '^((?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){0,1}$',
            errorMsg: '*Invalid address - Enter valid ip.',
            hoverMsg: '(Optional) - Ex: 82.84.86.88',
            unique: true,
          },
          {
            title: 'Port example',
            id: 'port',
            data: 'port',
            type: 'text',
            special: 'portRange',
            pattern:
              '^([0-9]{1,4}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$',
            errorMsg: '*Invalid port - Enter valid port or range.',
            hoverMsg: 'Ex: 6112 (single)   or   6111:6333 (range)',
            unique: true,
          },
          {
            title: 'Readonly example',
            id: 'read',
            data: 'read',
            type: 'readonly',
          },
        ];

        var url_ws_mock_get = './example4.json';
        if (location.href.startsWith('file://')) {
          // local URL's are not allowed
          url_ws_mock_get =
            'https://luca-vercelli.github.io/DataTable-AltEditor/example/04_more/example4.json';
        }

        //Table creation
        var myTable = $('#testTableData').dataTable({
          layout: { topStart: 'buttons' },
          ajax: url_ws_mock_get, //Receiving data from this source.
          columns: columnDefs, //Columns defined above.
          select: 'single', //Only single column selection is implemented.
          altEditor: true, //Enable altEditor.
          responsive: true, //Enable responsiveness.
          buttons: [
            {
              //All implemented buttons. Do not change name attribute.
              text: 'Create',
              name: 'add',
            },
            {
              extend: 'selected',
              text: 'Edit',
              name: 'edit',
            },
            {
              extend: 'selected',
              text: 'Delete',
              name: 'delete',
            },
            {
              text: 'Refresh',
              name: 'refresh',
            },
          ],
        });
      });

      // If the user has unsaved changes when reloading/leaving the page, then
      // an alert is displayed asking the user to confirm the action
      $(window).bind('beforeunload', function () {
        if (!$('#cancelButton').is(':disabled')) {
          return '';
        }
      });
    </script>
  </body>
</html>
