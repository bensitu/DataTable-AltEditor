version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Tokyo
    versioning-strategy: increase-if-necessary
    allow:
      - dependency-type: development
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: bootstrap4
      - dependency-name: bootstrap
        versions: ['>4.6.2 <5.0.0', '>=6.0.0']
      - dependency-name: datatables.net
        versions: ['>=3.0.0']
      - dependency-name: datatables.net-buttons
        versions: ['>=4.0.0']
      - dependency-name: datatables.net-select
        versions: ['>=4.0.0']
      - dependency-name: datatables21
        versions: ['>=2.2.0']
      - dependency-name: jquery
        versions: ['>=4.0.0']
    groups:
      npm-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Tokyo
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
