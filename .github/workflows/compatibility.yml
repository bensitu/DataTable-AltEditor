name: Compatibility
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --engine-strict
      - run: npx playwright install --with-deps
      - run: npm run test:compat
      - run: npm pack --dry-run
