name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24', '26']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - name: Verify committed distribution
        if: matrix.node == '24'
        run: git diff --exit-code -- dist
      - name: Check release metadata
        if: matrix.node == '24'
        shell: bash
        run: REQUESTED_VERSION="$(node -p "require('./package.json').version")" node scripts/prepare-release.mjs
      - run: npm run test:coverage
        if: matrix.node == '24'
      - run: npm test
        if: matrix.node != '24'
      - run: npx playwright install --with-deps chromium firefox
        if: matrix.node == '24'
      - run: npm run test:e2e
        if: matrix.node == '24'
      - name: Check fields and validation in Firefox
        if: matrix.node == '24'
        run: npx playwright test --project=firefox tests/browser/fields.spec.js tests/browser/validation.spec.js
