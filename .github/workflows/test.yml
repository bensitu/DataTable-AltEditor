name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24', '26']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - name: Check release metadata
        if: matrix.node == '24'
        shell: bash
        run: REQUESTED_VERSION="$(node -p "require('./package.json').version")" node scripts/prepare-release.mjs
      - run: npm run test:coverage
        if: matrix.node == '24'
      - run: npm test
        if: matrix.node != '24'
      - run: npx playwright install --with-deps chromium firefox
        if: matrix.node == '24'
      - run: npm run test:e2e
        if: matrix.node == '24'
      - name: Check fields and validation in Firefox
        if: matrix.node == '24'
        run: npx playwright test --project=firefox tests/browser/fields.spec.js tests/browser/validation.spec.js
